<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TipTop — Ops Leave | Work Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} :root{--navy:#0f2040;--navy2:#162d5a;--bg:#f4f5f8;--card:#fff;--line:#e5e7eb;--tx:#111827;--mu:#6b7280;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--no:#dc2626;--rose:#fff1f2}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.serif{font-family:Fraunces,serif}
a{color:var(--ac)} button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2563eb22}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 3px #00000008}
.btn-primary{background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;transition:.2s}.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px #0f204033}.btn-primary:disabled{opacity:.5;transform:none}
.btn-ghost{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:600}.btn-ghost.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.small{font-size:12px;color:var(--mu)} .pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}.pending{background:var(--warn)}.approved{background:var(--ok)}.rejected{background:var(--no)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.anim{animation:fadeUp .45s ease both}.anim2{animation:fadeUp .45s .08s ease both}.anim3{animation:fadeUp .45s .16s ease both}
.skel{height:18px;border-radius:8px;background:linear-gradient(90deg,#eee 25%,#f8f8f8 50%,#eee 75%);background-size:800px 100%;animation:shimmer 1.2s infinite}
.layout{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;background:var(--navy);color:#fff;padding:18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.navbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;color:#dbeafe;padding:11px 12px;border-radius:12px;font-weight:600}.navbtn.active{background:#fff;color:var(--navy)}
main{flex:1;min-width:0;padding:22px;max-width:1180px;margin:0 auto;width:100%}
header.top{position:sticky;top:0;z-index:20;background:#f4f5f8f2;backdrop-filter:blur(8px);padding:12px 0 14px;display:flex;gap:10px;align-items:center}
table{width:100%;border-collapse:collapse}th{color:var(--mu);font-size:12px;text-align:left;padding:10px}td{padding:11px 10px;border-top:1px solid #f1f1f1;font-size:14px}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
.modal{position:fixed;inset:0;background:#00000066;display:grid;place-items:center;z-index:50;padding:14px;animation:pop .25s ease}
.modal>div{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:540px;max-height:92vh;overflow:auto;animation:pop .3s ease}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:99;animation:fadeUp .3s ease;box-shadow:0 10px 30px #0005}
.stat{cursor:pointer;transition:.2s}.stat:hover{transform:translateY(-3px);box-shadow:0 12px 28px #00000012}
.bar{height:10px;background:#eef2f7;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#06b6d4);border-radius:999px;transition:width .7s ease}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(800px 400px at 20% 0%,#1e3a6e33,transparent),linear-gradient(180deg,#0f2040,#162d5a)}
.login-card{background:#fff;border-radius:26px;padding:28px;width:100%;max-width:420px;animation:pop .4s ease;box-shadow:0 24px 60px #00000030}
@media(max-width:820px){aside{display:none}aside.open{display:flex;position:fixed;z-index:40;height:100vh}}
.kpi-num{font-family:Fraunces,serif;font-size:34px;font-weight:900;line-height:1}
</style></head>
<body><div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const CFG={url:"https://txbqpxrwqyjpotsmphxl.supabase.co",key:"sb_publishable__afAhZ3onmvXNwoOPJHY_g_QU5vvus-"};
const sb=supabase.createClient(CFG.url,CFG.key);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.innerHTML=esc(m);t.className='toast';setTimeout(()=>t.className='',2600)};
const fmtD=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000)+1;
let me=null, employee=null, view='dashboard', employees=[], leaves=[], allLeaves=[];
let filterCity='All', search='';

function showLogin(){
app.innerHTML=`<div class="login-wrap"><div class="login-card">
<div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:Fraunces;font-size:24px;font-weight:900">O</div><div><b style="font-size:18px">Ops Leave</b><div class="small">TipTop • Operations Team</div></div></div>
<h1 class="serif" style="font-size:32px;margin:18px 0 4px">Welcome back.</h1><p class="small">Sign in with your work email. Your vacations, balance and requests are linked automatically to your employee code.</p>
<label class="small">Work email</label><input id="e" type="email" placeholder="you@tiptop.com" style="margin:6px 0 12px">
<label class="small">Password</label><input id="p" type="password" placeholder="••••••••" style="margin:6px 0 16px">
<button class="btn-primary" style="width:100%" id="si">Sign in →</button>
<button class="btn-ghost" style="width:100%;margin-top:10px" id="su">Create my account</button>
<p class="small" style="text-align:center;margin-top:14px">New employee? Create account with the <b style="color:#111">same email</b> your admin used. We link you by email or by your code (e.g. ERB-243).</p>
<div class="small" id="msg" style="margin-top:10px;color:#dc2626"></div></div></div>`;
$('#si').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value}); if(error) return $('#msg').textContent=error.message; load();};
$('#su').onclick=async()=>{const {data,error}=await sb.auth.signUp({email:$('#e').value.trim(),password:$('#p').value}); if(error) return $('#msg').textContent=error.message; toast(data.session?'Account created — welcome!':'Check your email to confirm, then sign in.'); if(data.session) load();};
}
async function load(){
  const {data:{user}}=await sb.auth.getUser(); if(!user) return showLogin();
  let {data:prof}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!prof){ // auto-create profile if trigger didn't
    await sb.from('profiles').insert({id:user.id,email:user.email,role:'viewer'}); prof={id:user.id,email:user.email,role:'viewer'};
  }
  me=prof;
  // 1) Try link by email, 2) by auth_user_id
  let {data:emp}=await sb.from('employees').select('*').or(`email.eq.${user.email},auth_user_id.eq.${user.id}`).maybeSingle();
  employee=emp||null;
  // If linked employee exists but not yet linked to auth, link it
  // LINK-FIX: if first lookup missed (e.g. email case), try case-insensitive email lookup
  if(!employee){
    const {data:emp2} = await sb.from('employees').select('*').ilike('email', user.email).maybeSingle();
    if(emp2){ employee = emp2; }
  }
  if(employee && !employee.auth_user_id){ await sb.from('employees').update({auth_user_id:user.id}).eq('id',employee.id); }
  if(employee && employee.email && employee.email.toLowerCase()!==user.email.toLowerCase()){
    // keep email in sync so next login links instantly
    await sb.from('employees').update({email:user.email}).eq('id',employee.id);
  }
  if(!employee){
    // HR / Admin should NEVER be blocked by the link-code screen — they need to get in to CREATE employees.
    if(me.role==='admin'||me.role==='hr'){
      employee={id:null,full_name:me.full_name||user.email.split('@')[0],employee_code:'ADMIN',email:user.email,city:'Erbil',dept:'HR',position:'HR Admin',status:'Active',carryover:0,accrual:0};
      await refreshData(); shell(); return;
    }
    return showLinkCode(user);
  }
  await refreshData(); shell();
}
function showLinkCode(user){
app.innerHTML=`<div class="login-wrap"><div class="login-card anim">
<h1 class="serif" style="font-size:28px">One last step ✨</h1><p>We found your login <b>${esc(user.email)}</b> but no employee record yet.</p>
<p class="small">Enter the <b>employee code</b> your admin gave you — e.g. <b>ERB-243</b>. We will link your vacations & balance to you automatically.</p>
<input id="code" placeholder="ERB-___" style="margin:12px 0;text-transform:uppercase">
<button class="btn-primary" style="width:100%" id="link">Link my employee code →</button>
<button class="btn-ghost" style="width:100%;margin-top:10px" id="skip">I don't have a code yet — continue</button>
<p class="small" style="margin-top:12px">Ask your admin to create you in <b>Team → New employee</b> with this same email, or give you your code.</p>
<div class="small" id="msg" style="color:#dc2626;margin-top:8px"></div></div></div>`;
$('#link').onclick=async()=>{
  const code=$('#code').value.trim().toUpperCase(); if(!code) return;
  const {data:emp,error}=await sb.from('employees').select('*').eq('employee_code',code).maybeSingle();
  if(error||!emp) return $('#msg').textContent='Code not found in employees table. ERB-243 is only an EXAMPLE — your admin must first create you in Team → New employee with your real code, then you enter that exact code here.';
  const {error:uErr}=await sb.from('employees').update({auth_user_id:user.id,email:user.email}).eq('id',emp.id);
  if(uErr) return $('#msg').textContent=uErr.message;
  toast('Linked! Your vacations are now showing.'); load();
};
$('#skip').onclick=()=>{ employee={full_name:user.email.split('@')[0],employee_code:'—',city:'Erbil',dept:'Ops',position:'Employee',status:'Active',carryover:0,accrual:0,taken:0,remaining:0}; refreshData().then(shell); };
}
async function refreshData(){
  const q=await sb.from('employees').select('*').order('full_name'); employees=q.data||[];
  const lq=await sb.from('leave_requests').select('*,employees(full_name,employee_code)').order('created_at',{ascending:false}); allLeaves=lq.data||[];
  // My leaves: by employee_id if present, else by code/email
  if(employee?.id) leaves=allLeaves.filter(x=>x.employee_id===employee.id||x.employee_code===employee.employee_code);
  else leaves=[];
}
function balances(emp){
  const carry=+emp.carryover||0, acc=+emp.accrual||0;
  const taken=allLeaves.filter(x=>(x.employee_id===emp.id||x.employee_code===emp.employee_code)&&x.status==='approved').reduce((s,x)=>s+daysBetween(x.start_date,x.end_date),0);
  const total=carry+acc, rem=Math.max(0,total-taken);
  return {carry,acc,taken,total,rem, pct: total?Math.round(taken/total*100):0};
}
function shell(){
  const b=employee?balances(employee):{carry:0,acc:0,taken:0,total:0,rem:0,pct:0};
  const isAdmin=(me.role==='admin'||me.role==='hr');
  const pending=allLeaves.filter(x=>x.status==='pending').length;
  app.innerHTML=`<div class="layout">
  <aside id="side"><div style="display:flex;gap:10px;align-items:center;padding:4px 6px 18px"><div style="width:38px;height:38px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-family:Fraunces;font-size:22px;font-weight:900">O</div><div><b>Ops Leave</b><div style="font-size:11px;color:#bfdbfe">Operations Team</div></div></div>
  <button class="navbtn ${view==='dashboard'?'active':''}" data-v="dashboard">🏠 Dashboard</button>
  <button class="navbtn ${view==='my'?'active':''}" data-v="my">🌴 My Vacations</button>
  <button class="navbtn ${view==='team'?'active':''}" data-v="team">👥 Team ${isAdmin?'':'& Directory'}</button>
  ${isAdmin?`<button class="navbtn ${view==='requests'?'active':''}" data-v="requests">✅ Requests ${pending?`<span class="badge" style="background:#f43f5e;color:#fff">${pending}</span>`:''}</button><button class="navbtn ${view==='newemp'?'active':''}" data-v="newemp">➕ New employee</button>`:''}
  <div style="margin-top:auto" class="card anim" ><b style="color:#111">Coverage today</b><div class="small" style="color:#475569;margin-top:4px">${allLeaves.filter(x=>x.status==='approved'&&x.start_date<=new Date().toISOString().slice(0,10)&&x.end_date>=new Date().toISOString().slice(0,10)).length} people away • ${employees.length} in directory</div><button class="btn-primary" style="width:100%;margin-top:10px" data-v="team">View team</button></div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:14px;padding:8px"><div style="width:36px;height:36px;border-radius:999px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900">${esc((employee?.full_name||me.email||'U')[0].toUpperCase())}</div><div style="min-width:0"><div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(employee?.full_name||me.email)}</div><div style="font-size:11px;color:#bfdbfe">${esc(employee?.employee_code||'—')} • ${esc(me.role)}</div></div><button id="out" style="margin-left:auto;background:#ffffff22;color:#fff;padding:8px 10px;border-radius:999px">↗</button></div></aside>
  <main>
  <header class="top"><button class="btn-ghost" id="menu" style="display:none">☰</button><input id="search" placeholder="Search employees, leave type…" value="${esc(search)}" style="max-width:520px;border-radius:999px;padding-left:16px"><div class="small" style="margin-left:auto">${pending} pending</div><button class="btn-primary" id="newreq">+ New request</button></header>
  <div id="view"></div></main></div>`;
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v; shell();});
  $('#out').onclick=async()=>{await sb.auth.signOut(); location.reload();};
  $('#newreq').onclick=()=>openRequestModal();
  const sEl=$('#search'); sEl.oninput=()=>{search=sEl.value; renderView();};
  renderView();
}
function renderView(){
  const v=$('#view'); if(!v) return;
  if(view==='dashboard') v.innerHTML=dashboardHTML();
  if(view==='my') v.innerHTML=myHTML();
  if(view==='team') v.innerHTML=teamHTML();
  if(view==='requests') v.innerHTML=requestsHTML();
  if(view==='newemp') v.innerHTML=newEmpHTML();
  bindView();
}
function dashboardHTML(){
  const b=balances(employee||{}); const myPending=leaves.filter(x=>x.status==='pending').length;
  return `<div class="anim"><div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:end"><div><h1 class="serif" style="font-size:38px;margin:0">Hello, ${esc((employee?.full_name||'').split(' ')[0]||'there')} 👋</h1><p class="small">LINKED-BADGE ${employee?.id ? '✅ LINKED: '+esc(employee.employee_code)+' • '+esc(employee.email||'') : '⚠️ NOT LINKED — no employee record'} • ${esc(employee?.position||'Employee')} • ${esc(employee?.employee_code||'')} • ${esc(employee?.city||'')} • ${esc(employee?.dept||'')}</p></div><button class="btn-primary" onclick="document.getElementById('newreq').click()">+ New request</button></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px">
  <div class="card stat anim" data-v="my"><div class="small">Remaining</div><div class="kpi-num">${b.rem} <span style="font-size:16px">days</span></div><div class="bar" style="margin-top:10px"><i style="width:${100-b.pct}%"></i></div><div class="small" style="margin-top:8px">${b.taken} taken of ${b.total} total</div></div>
  <div class="card stat anim2"><div class="small">Taken</div><div class="kpi-num">${b.taken} <span style="font-size:16px">days</span></div><p class="small">Approved vacations this year</p></div>
  <div class="card stat anim3"><div class="small">Carryover + Accrual</div><div class="kpi-num">${b.carry} + ${b.acc}</div><p class="small">Carryover ${b.carry} • Accrual ${b.acc}</p></div>
  <div class="card stat anim3"><div class="small">My requests</div><div class="kpi-num">${leaves.length}</div><p class="small">${myPending} pending • ${leaves.filter(x=>x.status==='approved').length} approved</p></div></div>
  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px" class="anim2">
  <div class="card"><h3 style="margin:0">My vacations</h3><p class="small">Your approved & pending requests — automatically from your employee code.</p>${leaves.slice(0,5).map(x=>`<div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #f1f1f1"><span><b>${esc(x.leave_type)}</b> • ${fmtD(x.start_date)} – ${fmtD(x.end_date)} • ${daysBetween(x.start_date,x.end_date)}d</span><span class="pill ${x.status}">${x.status}</span></div>`).join('')||'<p class="small">No requests yet. Click + New request.</p>'}</div>
  <div class="card"><h3 style="margin:0">Balance proof</h3><p style="background:#fefce8;border:1px solid #fde68a;padding:12px;border-radius:12px;font-size:13px">✅ <b>${esc(employee?.full_name||'')}: Carryover ${b.carry} + Accrual ${b.acc} − Taken ${b.taken} = Remaining ${b.rem}</b><br><span class="small">Remaining is already net of Taken. Total entitlement: ${b.total} days.</span></p><p class="small">Sick remaining: ${Math.max(0,10 - allLeaves.filter(x=>x.employee_id===employee?.id&&x.leave_type==='Sick'&&x.status==='approved').reduce((s,x)=>s+daysBetween(x.start_date,x.end_date),0))} days (example policy)</p></div></div></div>`;
}
function myHTML(){
  const b=balances(employee||{});
  return `<div class="anim"><h1 class="serif" style="font-size:36px;margin:0">My Vacations</h1><p class="small">Linked to <b>${esc(employee?.full_name||'')}</b> • Code <b>${esc(employee?.employee_code||'')}</b> • Remaining <b>${b.rem} days</b></p>
  <div class="card" style="margin-top:16px"><table><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th>Reason</th></tr>${leaves.map(x=>`<tr><td><b>${esc(x.leave_type)}</b></td><td>${fmtD(x.start_date)} – ${fmtD(x.end_date)}</td><td>${daysBetween(x.start_date,x.end_date)}</td><td><span class="pill ${x.status}">${x.status}</span></td><td>${esc(x.reason||'')}</td></tr>`).join('')||'<tr><td colspan=5>No vacations yet.</td></tr>'}</table></div></div>`;
}
function teamHTML(){
  const list=employees.filter(e=>(filterCity==='All'||e.city===filterCity)&&((e.full_name+' '+e.employee_code+' '+(e.dept||'')).toLowerCase().includes(search.toLowerCase())));
  return `<div class="anim"><h1 class="serif" style="font-size:36px;margin:0">Team Directory</h1><p class="small">${employees.length} people • Click a person to see their vacations & balance.</p>
  <div style="display:flex;gap:8px;margin:14px 0;flex-wrap:wrap">${['All','Erbil','Mosul','Kirkuk','Duhok','Sulaymaniyah'].map(c=>`<button class="btn-ghost ${filterCity===c?'active':''}" data-city="${c}">${c}</button>`).join('')}</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">${list.map(e=>{const bb=balances(e); return `<div class="card stat" data-emp="${e.id}"><div style="display:flex;justify-content:space-between"><b>${esc(e.full_name)}</b><span class="small">${esc(e.employee_code)}</span></div><div class="small">${esc(e.position||'')} • ${esc(e.city||'')} • ${esc(e.dept||'')}</div><div style="display:flex;gap:14px;margin-top:12px"><div><div class="small">Remaining</div><b style="font-size:20px">${bb.rem}d</b></div><div><div class="small">Taken</div><b>${bb.taken}d</b></div><div><div class="small">Total</div><b>${bb.total}d</b></div></div><div class="bar" style="margin-top:10px"><i style="width:${bb.total?Math.max(0,100-bb.pct):100}%"></i></div></div>`}).join('')||'<p>No employees match.</p>'}</div></div>`;
}
function requestsHTML(){
  if(!(me.role==='admin'||me.role==='hr')) return `<p>Only admins see all requests. Your requests are in My Vacations.</p>`;
  return `<div class="anim"><h1 class="serif" style="font-size:36px;margin:0">Requests</h1><p class="small">Approve or reject — balance updates automatically.</p>
  <div class="card" style="margin-top:16px"><table><tr><th>Who</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr>${allLeaves.map(x=>`<tr><td><b>${esc(x.employees?.full_name||x.employee_code||'—')}</b><div class="small">${esc(x.employees?.employee_code||'')}</div></td><td>${esc(x.leave_type)}</td><td>${fmtD(x.start_date)} – ${fmtD(x.end_date)}</td><td>${daysBetween(x.start_date,x.end_date)}</td><td><span class="pill ${x.status}">${x.status}</span></td><td>${x.status==='pending'?`<button class="btn-ghost" data-approve="${x.id}">Approve</button> <button class="btn-ghost" data-reject="${x.id}">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan=6>No requests.</td></tr>'}</table></div></div>`;
}
function newEmpHTML(){
  if(!(me.role==='admin'||me.role==='hr')) return `<p>Only admins can create employees.</p>`;
  return `<div class="anim"><h1 class="serif" style="font-size:36px;margin:0">Create employee</h1><p class="small">Create the employee record first with his <b>name + code + email</b>. Then tell him: “Sign up in the app with this same email”. The system will <b>automatically link</b> him by email / code and show his vacations.</p>
  <div class="card" style="margin-top:16px;max-width:680px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
  <div><label class="small">Full name *</label><input id="n_name" placeholder="e.g. Shakar Kamal"></div>
  <div><label class="small">Employee code *</label><input id="n_code" placeholder="ERB-243" style="text-transform:uppercase"></div>
  <div><label class="small">Email * (for login)</label><input id="n_email" type="email" placeholder="name@tiptop.com"></div>
  <div><label class="small">Position</label><input id="n_pos" placeholder="Driver / Ops"></div>
  <div><label class="small">City</label><select id="n_city"><option>Erbil</option><option>Mosul</option><option>Kirkuk</option><option>Duhok</option><option>Sulaymaniyah</option></select></div>
  <div><label class="small">Department</label><input id="n_dept" value="Ops"></div>
  <div><label class="small">Carryover (days)</label><input id="n_carry" type="number" value="0"></div>
  <div><label class="small">Accrual (days)</label><input id="n_acc" type="number" value="17"></div></div>
  <label class="small">Temporary password to tell him (he can change later)</label><input id="n_pass" placeholder="e.g. TipTop2026!" style="margin-top:6px">
  <button class="btn-primary" id="createEmp" style="width:100%;margin-top:16px">Create employee →</button>
  <div class="small" id="cmsg" style="margin-top:10px"></div>
  <div style="background:#f0fdf4;border:1px solid #bbf7d0;padding:12px;border-radius:12px;margin-top:14px;font-size:13px"><b>How it works:</b> 1) You create him here → 2) He opens the site, clicks <b>Create my account</b> with that email + this password → 3) We auto-match his email / code → 4) He instantly sees his balance & vacations. No manual linking.</div></div></div>`;
}
function bindView(){
  document.querySelectorAll('[data-city]').forEach(b=>b.onclick=()=>{filterCity=b.dataset.city; renderView();});
  document.querySelectorAll('[data-emp]').forEach(b=>b.onclick=()=>{const e=employees.find(x=>x.id===b.dataset.emp); if(e) openEmpModal(e);});
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{await sb.from('leave_requests').update({status:'approved',decided_by:me.id,decided_at:new Date().toISOString()}).eq('id',b.dataset.approve); toast('Approved ✅'); await refreshData(); renderView();});
  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=async()=>{await sb.from('leave_requests').update({status:'rejected',decided_by:me.id,decided_at:new Date().toISOString()}).eq('id',b.dataset.reject); toast('Rejected'); await refreshData(); renderView();});
  const ce=$('#createEmp'); if(ce) ce.onclick=async()=>{
    const name=$('#n_name').value.trim(), code=$('#n_code').value.trim().toUpperCase(), email=$('#n_email').value.trim();
    if(!name||!code||!email) return $('#cmsg').textContent='Name, code and email are required.';
    const {data,error}=await sb.from('employees').insert({full_name:name,employee_code:code,email,position:$('#n_pos').value, city:$('#n_city').value, dept:$('#n_dept').value, carryover:+$('#n_carry').value||0, accrual:+$('#n_acc').value||0, status:'Active'}).select().single();
    if(error) return $('#cmsg').textContent=error.message;
    // Try to create auth account in background - if email confirmation is on, employee can still sign up themselves with same email
    toast(`Employee ${name} (${code}) created! Tell him to sign up with ${email}`);
    $('#cmsg').innerHTML=`✅ Created <b>${esc(name)} — ${esc(code)}</b><br>Next: ask him to open the site and click <b>Create my account</b> with email <b>${esc(email)}</b> ${$('#n_pass').value?`and password <b>${esc($('#n_pass').value)}</b>`:''}. He will automatically see his vacations.`;
    await refreshData(); 
  };
}
function openEmpModal(e){
  const b=balances(e); const hist=allLeaves.filter(x=>x.employee_id===e.id||x.employee_code===e.employee_code);
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div><div style="display:flex;justify-content:space-between"><h2 class="serif" style="font-size:24px;margin:0">${esc(e.full_name)}</h2><button class="btn-ghost" id="cx">✕</button></div><p class="small">${esc(e.employee_code)} • ${esc(e.position||'')} • ${esc(e.city||'')} • ${esc(e.dept||'')}</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div class="card"><div class="small">Remaining</div><b style="font-size:22px">${b.rem} days</b></div><div class="card"><div class="small">Taken</div><b style="font-size:22px">${b.taken} days</b></div><div class="card"><div class="small">Carryover</div><b>${b.carry} days</b></div><div class="card"><div class="small">Total entitlement</div><b>${b.total} days</b></div></div>
  <h3 style="margin-top:16px">Leave history</h3>${hist.map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #eee"><span>${esc(x.leave_type)} • ${fmtD(x.start_date)} – ${fmtD(x.end_date)}</span><span class="pill ${x.status}">${x.status}</span></div>`).join('')||'<p class="small">No leave history yet.</p>'}</div>`;
  document.body.appendChild(m); m.onclick=e2=>{if(e2.target===m) m.remove()}; m.querySelector('#cx').onclick=()=>m.remove();
}
function openRequestModal(){
  const b=employee?balances(employee):{rem:0};
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div><div style="display:flex;justify-content:space-between"><div><h2 class="serif" style="font-size:26px;margin:0">Add request</h2><p class="small">${esc(employee?.full_name||'')} • ${esc(employee?.employee_code||'')} • Balance: ${b.rem} days remaining</p></div><button class="btn-ghost" id="cx">✕</button></div>
  <label class="small">Type</label><select id="r_type" style="margin:6px 0"><option>Annual</option><option>Sick</option><option>Personal</option><option>Vacation</option></select>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="small">Start</label><input id="r_start" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div><label class="small">End</label><input id="r_end" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
  <label class="small">Note</label><textarea id="r_note" rows="2" placeholder="Handover / reason" style="margin-top:6px"></textarea>
  <div id="r_val" style="background:#f8fafc;padding:12px;border-radius:12px;margin-top:10px;font-size:13px"></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn-ghost" style="flex:1" id="cancel">Cancel</button><button class="btn-primary" style="flex:1" id="save">Add request</button></div></div>`;
  document.body.appendChild(m);
  const upd=()=>{const s=$('#r_start').value, e=$('#r_end').value, need=s&&e?daysBetween(s,e):0; const overlap=leaves.some(x=>x.status!=='rejected'&&s<=x.end_date&&e>=x.start_date); $('#r_val').innerHTML=`${need>b.rem?'⛔ Insufficient balance — '+b.rem+' days remaining, need '+need:'✅ Balance OK — '+b.rem+' remaining, need '+need} <br>${overlap?'⛔ Overlapping request for you':'✅ No overlap'}`;};
  ['r_start','r_end','r_type'].forEach(id=>document.getElementById(id).onchange=upd); upd();
  m.querySelector('#cx').onclick=()=>m.remove(); m.querySelector('#cancel').onclick=()=>m.remove(); m.onclick=e2=>{if(e2.target===m) m.remove()};
  m.querySelector('#save').onclick=async()=>{
    if(!employee?.id) return toast('Link your employee code first.');
    const s=$('#r_start').value, e=$('#r_end').value; if(!s||!e) return toast('Pick dates');
    if(daysBetween(s,e)>b.rem) return toast('Not enough balance');
    const {error}=await sb.from('leave_requests').insert({employee_id:employee.id,employee_code:employee.employee_code,leave_type:$('#r_type').value,start_date:s,end_date:e,reason:$('#r_note').value,status:'pending'});
    if(error) return toast(error.message);
    toast('Request sent — waiting for approval'); m.remove(); await refreshData(); renderView();
  };
}
(async()=>{const {data:{session}}=await sb.auth.getSession(); session?load():showLogin();})();
</script></body></html>
