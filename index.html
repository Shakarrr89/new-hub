<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wade Leave — Live from Google Sheet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Fraunces:opsz,wght@9..144,900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}:root{--navy:#0f2040;--bg:#f4f5f8;--line:#e5e7eb;--mu:#6b7280}body{margin:0;font-family:Inter,system-ui;background:var(--bg)} .serif{font-family:Fraunces,serif} .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px} .btn-primary{background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-weight:700;border:0;cursor:pointer} .btn-ghost{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-weight:600;cursor:pointer} input,select{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px} .small{font-size:12px;color:var(--mu)} .pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff} .pending{background:#d97706}.approved{background:#16a34a}.layout{display:flex;min-height:100vh} aside{width:250px;background:var(--navy);color:#fff;padding:18px;display:flex;flex-direction:column} main{flex:1;padding:22px;max-width:1180px;margin:0 auto;width:100%} @media(max-width:820px){aside{display:none}} table{width:100%;border-collapse:collapse} th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left;font-size:13px} .kpi{font-family:Fraunces,serif;font-size:34px;font-weight:900}</style></head>
<body><div id="app"></div>
<script>
const SHEET_ID="1saMvQEvwJvyjuCZrGE5vxUe_R1BuSIunwo1yx14jY-8";
const CFG={url:"https://txbqpxrwqyjpotsmphxl.supabase.co",key:"sb_publishable__afAhZ3onmvXNwoOPJHY_g_QU5vvus-"};
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtD=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
let summary=[], leaves=[], meCode='', me=null, view='dashboard', search='';
async function gviz(sheet){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}&headers=1`;
  const res=await fetch(url); const txt=await res.text();
  const json=JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}')+1));
  const cols=json.table.cols.map(c=>c.label);
  const rows=json.table.rows.map(r=>{ const o={}; r.c.forEach((c,i)=>{ let v=c?c.v:null; if(c&&c.f!==undefined&&typeof v==='string'&&v.startsWith('Date(')){ const m=v.match(/Date\((\d+),(\d+),(\d+)/); if(m) v=`${m[1]}-${String(+m[2]+1).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`; } o[cols[i]]=v; }); return o; });
  return rows;
}
async function loadLive(){
  app.innerHTML=`<div style="max-width:520px;margin:80px auto;text-align:center"><h2 class="serif">Loading live from Google Sheet…</h2><p class="small">Copy of Operations Team Leaves • Leaves Log + Overall Summary</p></div>`;
  try{
    const [sum, log] = await Promise.all([gviz('Overall Summary'), gviz('Leaves Log')]);
    summary=sum.filter(r=>r.HR && String(r.HR).trim() && r.HR!=='HR'); leaves=log.filter(r=>r.Date && r['HR ID']);
    // Normalize summary: columns are weird: first col is Unit, second HR, third Name, etc. gviz labels may be empty for first col.
    // Re-map by position: use raw rows order - we already have keys, but handle empty labels by using values array
    renderLogin();
  }catch(e){ app.innerHTML=`<div style="max-width:560px;margin:60px auto;background:#fff;padding:28px;border-radius:18px"><h2>Sheet is not public yet</h2><p>To go live, share the sheet:</p><ol><li>Open the Google Sheet → Share → <b>Anyone with the link → Viewer</b></li><li>File → Share → Publish to web → Publish</li><li>Reload this page</li></ol><p class="small">Error: ${esc(e.message)}</p><button class="btn-primary" onclick="location.reload()">Retry</button></div>`; }
}
function findEmp(code){ return summary.find(r=>String(r.HR||'').trim().toUpperCase()===code.toUpperCase()); }
function myLeaves(code){ return leaves.filter(r=>String(r['HR ID']||'').trim().toUpperCase()===code.toUpperCase()).sort((a,b)=>String(b.Date).localeCompare(String(a.Date))); }
function daysFor(r){ const t=String(r.Type||''); return t.toLowerCase().includes('half')?0.5:1; }
function renderLogin(){
  app.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:100%;max-width:440px;padding:28px"><div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:Fraunces;font-size:24px">O</div><div><b style="font-size:18px">Wade Leave</b><div class="small">LIVE • Google Sheet • Operations Team</div></div></div><h1 class="serif" style="font-size:30px;margin:18px 0 4px">Welcome back.</h1><p class="small">Enter your HR code — e.g. <b>ERB-250</b> for Sami. Data is live from the sheet, no copy-paste.</p><label class="small">Employee code</label><input id="code" placeholder="ERB-250" style="margin:6px 0 12px"><label class="small">Email (for Supabase login — optional)</label><input id="email" placeholder="Sami.Saud@wadedelivery.com" style="margin:6px 0 12px"><label class="small">Password (Supabase)</label><input id="pass" type="password" placeholder="123sami123" style="margin:6px 0 12px"><div id="msg" class="small" style="color:#dc2626"></div><button class="btn-primary" style="width:100%;margin-top:10px" id="enter">Enter → See my live vacations</button><p class="small" style="margin-top:10px">✅ Live: <b>${summary.length} employees</b> • <b>${leaves.length} leave rows</b> from the sheet just now.</p><p class="small">Sheet: <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank">Copy of Operations Team Leaves</a></p></div></div>`;
  $('#enter').onclick=()=>{
    const code=$('#code').value.trim().toUpperCase(); if(!code) return $('#msg').textContent='Enter your code, e.g. ERB-250';
    const emp=findEmp(code); if(!emp) return $('#msg').textContent='Code '+code+' not found in Overall Summary. Check the sheet.';
    meCode=code; me=emp; shell();
  };
}
function balance(emp){
  // Overall Summary columns: 2025 Remaining = Carryover, Eligible = Remaining? Actually sheet: Col I = 2025 Remaining (carryover), Col J = Eligible (remaining), Col K = Taken Leaves Annual
  // We use: carry = emp['2025 Remaining'], rem = emp['Eligible'], taken = emp['Annual'] (under Taken Leaves)
  // Fallback: compute from leaves log if summary missing
  const carry=parseFloat(emp['2025 Remaining'])||0;
  const rem=parseFloat(emp['Eligible'])||0;
  const taken=parseFloat(emp['Annual'])||0;
  // Total entitlement = carry + accrual, accrual = rem + taken - carry
  const accrual=rem+taken-carry;
  return {carry, rem, taken, accrual, total:carry+accrual};
}
function shell(){
  const b=balance(me); const my=myLeaves(meCode);
  app.innerHTML=`<div class="layout"><aside><div style="display:flex;gap:10px;align-items:center;padding:4px 6px 18px"><div style="width:38px;height:38px;border-radius:12px;background:#fff;color:var(--navy);display:grid;place-items:center;font-family:Fraunces;font-size:22px">O</div><div><b>Wade Leave</b><div style="font-size:11px;color:#bfdbfe">LIVE • Google Sheet</div></div></div><button class="btn-ghost" style="background:#fff;color:var(--navy);margin-bottom:8px" onclick="view='dashboard';shell()">🏠 My Home</button><button class="btn-ghost" style="background:#fff;color:var(--navy);margin-bottom:8px" onclick="view='my';shell()">🌴 My Vacations</button><button class="btn-ghost" style="background:#fff;color:var(--navy)" onclick="view='team';shell()">👥 Team (live)</button><div style="margin-top:auto" class="card" ><b style="color:#111">Live from Sheet</b><div class="small" style="color:#475569">Changes in the Google Sheet show here on reload. No SQL copy needed.</div><button class="btn-primary" style="width:100%;margin-top:10px" onclick="loadLive()">↻ Reload live</button></div><div style="display:flex;gap:8px;align-items:center;margin-top:14px"><div style="width:36px;height:36px;border-radius:999px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:900">${esc((me.Name||'U')[0])}</div><div><div style="font-weight:700;font-size:13px">${esc(me.Name||'')}</div><div style="font-size:11px;color:#bfdbfe">${meCode} • ${esc(me.Position||'')}</div></div></div></aside><main><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1 class="serif" style="font-size:36px;margin:0">Hello, ${esc(String(me.Name||'').split(' ')[0])} 👋</h1><p class="small">LIVE • ${esc(me.Name||'')} • ${meCode} • ${esc(me.Position||'')} • ${esc(me.Region||'')} • ${esc(me.Unit||'')} • <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit" target="_blank">Open Sheet ↗</a></p></div><button class="btn-primary" onclick="location.reload()">↻ Reload live</button></div>
  ${view==='dashboard'?dashboardHTML(b,my):view==='my'?myHTML(b,my):teamHTML()}
  </main></div>`;
}
function dashboardHTML(b,my){
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px"><div class="card"><div class="small">Remaining (live)</div><div class="kpi">${b.rem} <span style="font-size:16px">days</span></div><div class="small">${b.taken} taken of ${b.total} total</div></div><div class="card"><div class="small">Taken (Annual, live)</div><div class="kpi">${b.taken} <span style="font-size:16px">days</span></div><p class="small">From Overall Summary</p></div><div class="card"><div class="small">Carryover + Accrual</div><div class="kpi">${b.total} <span style="font-size:16px">days</span></div><p class="small">Carryover ${b.carry} + Accrual ${b.accrual}</p></div><div class="card"><div class="small">Leave rows (Leaves Log)</div><div class="kpi">${my.length}</div><p class="small">Every day from the sheet</p></div></div><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px"><div class="card"><h3>My vacations (live)</h3>${my.slice(0,8).map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #eee"><span><b>${esc(x.Leave||'')}</b> • ${fmtD(x.Date)} • ${daysFor(x)} day • ${esc(x.Type||'')}</span><span>${esc(x.Note||'')}</span></div>`).join('')||'<p class="small">No rows in Leaves Log for you yet.</p>'}</div><div class="card"><h3>Balance proof (live)</h3><p style="background:#fefce8;border:1px solid #fde68a;padding:12px;border-radius:12px;font-size:13px">✅ <b>Carryover ${b.carry} + Accrual ${b.accrual} − Taken ${b.taken} = Remaining ${b.rem}</b><br><span class="small">Directly from Overall Summary tab. No SQL.</span></p><button class="btn-primary" style="width:100%;margin-top:10px" onclick="view='my';shell()">See full history →</button></div></div>`;
}
function myHTML(b,my){
  return `<div><h1 class="serif" style="font-size:36px;margin:0">My Vacations — LIVE</h1><p class="small">Every row from Leaves Log for ${meCode} • ${my.length} rows • Full Day = 1, Half Day = 0.5</p><div class="card" style="margin-top:16px;border:1px solid #fde68a;background:#fefce8"><h3 style="margin:0">📅 Vacation History — Live from Google Sheet</h3><p class="small">Carryover ${b.carry} + Accrual ${b.accrual} − Taken ${b.taken} = Remaining ${b.rem} • Taken from Leaves Log: <b>${my.reduce((s,x)=>s+daysFor(x),0).toFixed(1)} days</b> (Annual + Sick + etc. in log) • Summary Annual Taken: ${b.taken}</p></div><div class="card" style="margin-top:16px"><table><tr><th>Date</th><th>Leave</th><th>Type</th><th>Days</th><th>Note</th></tr>${my.map(x=>`<tr><td>${fmtD(x.Date)}</td><td><b>${esc(x.Leave||'')}</b></td><td>${esc(x.Type||'')}</td><td>${daysFor(x)}</td><td>${esc(x.Note||'')}</td></tr>`).join('')||'<tr><td colspan=5>No rows yet.</td></tr>'}</table></div></div>`;
}
function teamHTML(){
  const q=(search||'').toLowerCase(); const list=summary.filter(r=>(String(r.Name||'')+' '+String(r.HR||'')).toLowerCase().includes(q));
  return `<div><h1 class="serif" style="font-size:36px;margin:0">Team — Live from Sheet</h1><p class="small">${list.length} people • From Overall Summary • Click a code to view his live history.</p><input placeholder="Search name or code…" value="${esc(search)}" oninput="search=this.value;shell()" style="margin:14px 0;max-width:420px"><div class="card"><table><tr><th>Code</th><th>Name</th><th>Carryover</th><th>Accrual</th><th>Taken</th><th>Remaining</th></tr>${list.map(r=>{ const bb=balance(r); return `<tr style="cursor:pointer" onclick="meCode='${String(r.HR).trim()}';me=findEmp(meCode);view='my';shell()"><td><b>${esc(r.HR||'')}</b></td><td>${esc(r.Name||'')}</td><td>${bb.carry}</td><td>${bb.accrual}</td><td>${bb.taken}</td><td><b>${bb.rem}</b></td></tr>`}).join('')}</table></div></div>`;
}
loadLive();
</script></body></html>
