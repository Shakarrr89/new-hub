* {

html {

body {

button, input {

button {

n li epê Wade êkser dûvçûnê bket.",en:"Please provide us with a photo of the issue with your order, ], so that our customer service team at Wade app can investigate and resolve it immediately."},{case:"Problem- حل خطأ وصول الطلب",ar:"نعتذر بشدة، يمكننا الآن حل مشكلتكم بطريقتين: يمكننا إرسال سائقنا إليكم لتغيير الطلب وإحضار الطلب الصحيح، لكن هذا الأمر سيستغرق الكثير من الوقت. وإذا كنتم ترغبون في حل المشكلة بشكل أسرع، يمكننا تعويضكم بقيمة النقص عبر كوبون خصم لطلبكم القادم.",so_ar:"زۆر داوای لێبوردن دەکەین، ئێستا دەتوانین بە دوو شێواز ئەو کێشەیەتتان چارەسەر بکەین، دەتوانین شوفێرەکەمان لەبۆ بەڕێزتان بنێرین داواکارییکەتتان بگوڕێت و داواکارییە ڕاستەکە لە بۆتان بینیت بەڵام زۆر کاتی پێ دەچێت. وئەگەر دەتانەوێ کیشەکەتان زووتر چارەسەر بکرێت دەتوانین قەرەبووتان بکەین بە نرخی کەموکوڕییەکە بە کۆبۆنێکی داشکاندن لەبۆ داواکاری داهاتووتان.",so_lt:"Zor daway lêburdin dekeyn, êsta detwanîn be dwû şêwaz ew kêşeyetan çareser bikeyn: detwanîn şofêrekeman lebo beřêztan bînêrîn dawakariyeketjan biguřêt û dawakariye rasteke le botan bênêt bełam zor katî pê deçêt. Û eger detanewê kêşeketjan zûter çareser bikrêt detwanîn qerebûtan bikeyn be nirxî kemukoriyeke be kobonêkî daşkanidin lebo dawakarî dahtu.",ba_ar:"داخازا لێبورینی دکەین بەڕێز، ئەم دێ شێین نوکە ب دوو ڕێکا کێشا تە چارەسەر بکەین: وە بڤێت دێ داخازیا هەوە گهوڕین با درست بو هەوە بینین بەلێ پا گەلەک دەم دی پێڤە چیت تا بگەهیت، یان هەوە چارەسەرەکا زییتر بڤێت ئەم دێ کوبونەکێ ب بهایێ خەلەتیێ فڕێکەیین، هوین دێ شێن د داخازیا داهاتی دا بکاربینن د هەر خارنگەها هەوە بڤێت.",ba_lt:"Daxaza lêborînî dkeyn beřêz, em dê şêyn nuke bi dû rêka kêşa te çareser bkeyn: we bvêt dê daxazya hewe ghurn ba drust bo hewe bînîn belê pa gelek dem dê pêve çît ta bgehît, yan hewe çaresereka zîtir bvêt em dê kubonekê bi bihayê xeletiyê fřêkeyn, huyn dê şên d daxazya dahatî da bkarbînin d her xaringeha hewe bvêt",en:'"We sincerely apologize. We can resolve your issue in two ways: we can send our driver to exchange the order and bring you the correct one, but this will take a lot of time. Alternatively, if you want a quicker solution, we can compensate you for the missing item(s) with a discount coupon for your next order.'},{case:"24 ساعە و تستلم الکوبون",ar:"سيتم إضافة قيمة التعويض خلال 24 ساعة من الطلب، يمكنك استلامه في محفضة وادێ في تطبيق وادێ.",so_ar:"بڕی قەرەبووەکە لە ماوەی ٢٤ کاتژمێردا لە کاتی داواکارییەکەوە زیاد دەکرێت، لە جزدانی وادێ بەردەست دەبێت.",so_lt:"Koponeketan le mawey 24 katjmêr le katî dawakarîyeketan bo hejmareketan ziyad dekrê, le beşî koponekan berdast debêt",ba_ar:"بهایێ قەرەبوویێ د ماوێ ٢٤ دەمژمێران دا ژ کاتێ داخوازیێ دێ هێتە زێدەکرن، دێ د جزدانێ وادێ دا بەردەست بیت.",ba_lt:"coupona hewa l mawe 24 damzhmera de heta hazhmara hewa da. hwen de shen l bashe coupona bbinn.",en:"The compensation amount will be added within 24 hours of the order; you can receive it in the Wade wallet in the Wade app."},{case:"Compensation / تعويض",ar:"نعتذر بشدة عن الخطأ الحاصل \uD83D\uDE4F كاعتذار بسيط عن هذه التجربة غير المرضية، سيتم إضافة قيمة النقص الى محفضة لحسابك يمكنك استخدامه في طلبك القادم. نعدك بتقديم الأفضل دائماً.",so_ar:"ئێمە زۆر داوای لێبوردن دەکەین لەو هەڵەیەی کە ڕوویداوە \uD83D\uDE4F وەک داوای لێبوردنێکی بچووک بۆ ئەم ئەزموونە نادڵخۆشکەرە، بڕی پارەی کەمییەکە دەخرێتە سەر جزدانی ئەژمارەکەت کە دەتوانیت لە داواکاری داهاتووتدا بەکاری بهێنیت. بەڵێنت پێدەدەین هەمیشە باشترین پێشکەش بکەین.\uD83E\uDE75",so_lt:"Daway lêburdin dekeyn bo ew hełeyey rûwîda \uD83D\uDE4F Wek qerebûyek bo em ezmûne nexwazrawe, Qarabuwaka daxreta ser jizdanakay wade ejmareket bo dawakarî dahatût.",ba_ar:"داخوازا لێبۆرینێ دکەین بۆ وێ خەلەتییا چێبووی  \uD83D\uDE4F ئەم دێ هەوە قەرەبوو کەین بۆ ڤێ ئەزموونا نەخۆش، بهایێ قەرەبووکرنێ دێ هێتە زێدەکرن بۆ سەر جزدانا  د هەژمارا هەوە یا وادێ دا  هوین دێ شێن هەر خارنگەها هەوە بڤێت داخازکەن دێ بو هەوە کەتە داشکاندن.\uD83D\uDE0A\uD83E\uDE75",ba_lt:"Daxwaza lêborînê dkeyn bo wê xeletîya çêbuuyî  \uD83D\uDE4F Wek qerebûkrneka bçûk bo vê ezmûna nexoş, bhaye xalatye de hena qarabukrn lsar jzdana wade.",en:"We deeply apologize for the error that occurred \uD83D\uDE4F As a small gesture of apology for this unsatisfactory experience, the amount for the missing items will be added to your account wallet, which you can use for your next order. We promise to always provide you with the best."},{case:"اعتذار عن الخطأ",ar:"نعتذر عن التجربة الغير موفقة، يرجى الانتظار لحظات من فضلك سأقوم بالمتابعة الفورية لموضوعك الآن. و ما یکون إلا خاطرك طيب ويا وادێ\uD83E\uDE75",so_ar:`
