<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wade HR – Vacations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0a2a5e;--blue:#1769e0;--sky:#e8f1fd;--line:#dbe4f0;--ink:#17233a;--mut:#62708a;--ok:#13875b;--bad:#c93a3a;--warn:#b7791f;--bg:#f5f8fc}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}button.bad{background:var(--bad)}button.ok{background:var(--ok)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--navy);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh}
nav h1{font-size:18px;margin:0 8px 18px}nav small{display:block;opacity:.7;margin:0 8px 14px}
nav a{display:flex;justify-content:space-between;padding:9px 12px;border-radius:8px;color:#cfe0fb;cursor:pointer;text-decoration:none}
nav a.on,nav a:hover{background:rgba(255,255,255,.14);color:#fff}
.badge{background:#ff5b5b;color:#fff;border-radius:99px;padding:0 7px;font-size:12px}
main{padding:24px;max-width:1100px;width:100%}
h2{margin:0 0 16px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.card b{display:block;font-size:26px;color:var(--navy)}.card span{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{background:var(--sky);color:var(--navy)}.wrap{overflow-x:auto}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;background:var(--sky);color:var(--navy);white-space:nowrap}
.pill.approved{background:#dff5ea;color:var(--ok)}.pill.rejected,.pill.cancelled{background:#fbe4e4;color:var(--bad)}
.steps{display:flex;gap:4px}.steps i{height:6px;width:26px;border-radius:3px;background:var(--line)}.steps i.d{background:var(--ok)}.steps i.c{background:var(--blue)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cal>div{background:#fff;min-height:84px;padding:4px;font-size:12px}.cal .h{min-height:0;background:var(--sky);text-align:center;font-weight:600}
.ev{display:block;margin-top:2px;padding:1px 5px;border-radius:4px;background:var(--blue);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev.p{background:#bcd3f7;color:var(--navy)}
.login{max-width:380px;margin:12vh auto;padding:28px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:9}
#toast div{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;max-width:320px}
dialog{border:0;border-radius:12px;width:min(520px,94vw);padding:20px}dialog::backdrop{background:rgba(10,42,94,.45)}
.msg{background:var(--sky);border-radius:8px;padding:6px 10px;margin:6px 0}.msg small{color:var(--mut)}
.unread{font-weight:600}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:4px}nav h1,nav small{width:100%}main{padding:14px}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div><dialog id="dlg"></dialog>
<script>
const SB_URL='https://txbqpxrwqyjpotsmphxl.supabase.co';
const SB_KEY='sb_publishable__afAhZ3onmvXNwoOPJHY_g_QU5vvus-'; // publishable key; safe in the browser. Never put the service-role key here.
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={pending_tl:'Pending Team Leader',pending_manager:'Pending Manager',pending_hr:'Pending HR',approved:'Approved',rejected:'Rejected',cancelled:'Cancelled'};
const YEAR=new Date().getFullYear();
let me=null,view='dash',openReq=null,types=[];
const isHR=()=>['hr','hr_admin'].includes(me.role);
const isAppr=()=>['team_leader','manager','hr','hr_admin'].includes(me.role);

function toast(t){const d=document.createElement('div');d.textContent=t;$('#toast').append(d);setTimeout(()=>d.remove(),5000)}
const pill=s=>`<span class="pill ${s}">${ST[s]||esc(s)}</span>`;
function steps(r){const o=['pending_tl','pending_manager','pending_hr'];const i=o.indexOf(r.status);
  return `<div class="steps" title="Team Leader → Manager → HR">`+o.map((_,k)=>`<i class="${r.status==='approved'||k<i?'d':k===i?'c':''}"></i>`).join('')+`</div>`}
const fmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});

/* ---------- auth ---------- */
function loginUI(msg=''){
  $('#app').innerHTML=`<div class="card login"><h2>Wade HR</h2><p style="color:var(--mut)">Sign in to manage your vacations.</p>
  <label for="em">Email</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p style="color:var(--bad)">${esc(msg)}</p>
  <div class="row"><button onclick="signIn()">Sign in</button><button class="ghost" onclick="signUp()">Create account</button></div>
  <small style="color:var(--mut)">Create your account with the email HR has on file for you.</small></div>`}
async function signIn(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});error?loginUI(error.message):boot()}
async function signUp(){const {error}=await sb.auth.signUp({email:$('#em').value,password:$('#pw').value});error?loginUI(error.message):loginUI('Account created. Confirm your email if asked, then sign in.')}
async function out(){await sb.auth.signOut();location.reload()}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return loginUI();
  const {data}=await sb.rpc('hr_link_account');me=data;
  if(!me){$('#app').innerHTML=`<div class="card login"><h2>No employee record</h2><p>${esc(session.user.email)} is not linked to an employee. Ask HR to add this email.</p><button onclick="out()">Sign out</button></div>`;return}
  types=(await sb.from('hr_leave_types').select('*').eq('active',true).order('name')).data||[];
  shell();go('dash');live();badge()}

function nav(){return [['dash','Dashboard'],['new','New request'],['mine','My requests'],...(isAppr()?[['appr','Approvals']]:[]),['cal','Calendar'],['hist','Vacation History'],['hist','Vacation History'],['notif','Notifications'],
  ...(isHR()?[['emp','Employees'],['rep','Reports']]:[]),...(me.role==='hr_admin'?[['pol','Policies']]:[])]}
function shell(){$('#app').innerHTML=`<div class="app"><nav><h1>Wade HR</h1><small>${esc(me.full_name)}<br>${esc(me.role.replace('_',' '))}</small>
  ${nav().map(([k,l])=>`<a data-v="${k}" onclick="go('${k}')">${l}${k==='notif'?'<span class="badge" id="nb" hidden></span>':''}</a>`).join('')}
  <a onclick="out()">Sign out</a></nav><main id="main"></main></div>`}
async function go(v){view=v;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));await V[v]?.()}

/* ---------- realtime ---------- */
const LIVE=['dash','mine','appr','cal','notif','emp'];
function live(){['hr_requests','hr_notifications','hr_messages','hr_balances','hr_approvals'].forEach(t=>
  sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},p=>{
    badge();
    if(t==='hr_notifications'&&p.eventType==='INSERT'&&p.new.employee_id===me.id)toast(p.new.title);
    if(LIVE.includes(view))V[view]();
    if(t==='hr_messages'&&openReq&&$('#dlg').open)msgs(openReq)}).subscribe())}
async function badge(){const {count}=await sb.from('hr_notifications').select('id',{count:'exact',head:true}).eq('read',false);
  const b=$('#nb');if(b){b.textContent=count||'';b.hidden=!count}}

/* ---------- views ---------- */
const V={
async dash(){
  const [{data:b},{data:rs}]=await Promise.all([sb.from('hr_balances').select('*').eq('employee_id',me.id).eq('year',YEAR).maybeSingle(),
    sb.from('hr_requests').select('*').eq('employee_id',me.id)]);
  const rem=b?b.entitlement+b.carried+b.adjustments-b.used-b.pending:0,n=s=>(rs||[]).filter(r=>r.status===s).length;
  const up=(rs||[]).filter(r=>r.status==='approved'&&r.end_date>=new Date().toISOString().slice(0,10)).length;
  let hr='';
  if(isHR()){const {data:s}=await sb.rpc('hr_stats');
    hr=`<h2>Company</h2><div class="grid">${[['Employees',s.employees],['On vacation now',s.on_vacation],['Waiting Team Leader',s.pending_tl],['Waiting Manager',s.pending_manager],['Waiting HR',s.pending_hr],['Approved',s.approved],['Rejected',s.rejected]].map(([l,v])=>`<div class="card"><b>${v??0}</b><span>${l}</span></div>`).join('')}</div>`}
  $('#main').innerHTML=`<div class='card' style='margin-bottom:16px'><b>Vacation History is live</b> - open <a onclick="go('hist')" style='cursor:pointer;color:var(--blue)'>Vacation History</a> for the full Sheet history.</div><h2>Hello, ${esc(me.full_name.split(' ')[0])}</h2><div class="grid">
  <div class="card"><b>${rem}</b><span>Days remaining (${YEAR})</span></div><div class="card"><b>${b?.used??0}</b><span>Days used</span></div>
  <div class="card"><b>${b?.pending??0}</b><span>Days pending</span></div><div class="card"><b>${up}</b><span>Upcoming vacations</span></div>
  <div class="card"><b>${n('rejected')}</b><span>Rejected</span></div></div>${hr}`},

async new(){
  $('#main').innerHTML=`<h2>New vacation request</h2><div class="card" style="max-width:520px">
  <label for="lt">Leave type</label><select id="lt">${types.map(t=>`<option value="${t.code}">${esc(t.name)}</option>`).join('')}</select>
  <div class="row"><div style="flex:1"><label for="sd">Start</label><input id="sd" type="date"></div><div style="flex:1"><label for="ed">End</label><input id="ed" type="date"></div></div>
  <label for="rs">Reason</label><textarea id="rs" rows="3"></textarea>
  <label for="doc">Supporting document link (if required)</label><input id="doc" placeholder="https://…">
  <p style="color:var(--mut)">Your Team Leader and Manager are assigned automatically.</p><button onclick="submitReq()">Submit request</button></div>`},

async mine(){
  const {data}=await sb.from('hr_requests').select('*').eq('employee_id',me.id).order('created_at',{ascending:false});
  $('#main').innerHTML=`<h2>My requests</h2>${table(['Type','Dates','Days','Progress','Status',''],(data||[]).map(r=>
   [esc(r.leave_code),`${fmt(r.start_date)} – ${fmt(r.end_date)}`,r.days,steps(r),pill(r.status),
   `<button class="ghost" onclick="msgs('${r.id}')">Details</button> ${['approved','pending_tl','pending_manager','pending_hr'].includes(r.status)?`<button class="ghost" onclick="cancelReq('${r.id}')">Cancel</button>`:''}`]))}`},

async appr(){
  const st=me.role==='team_leader'?'pending_tl':me.role==='manager'?'pending_manager':'pending_hr';
  const {data}=await sb.from('hr_requests').select('*,emp:hr_employees(full_name,position)').eq('status',st).order('created_at');
  $('#main').innerHTML=`<h2>Approvals · ${ST[st]}</h2>${table(['Employee','Type','Dates','Days',''],(data||[]).map(r=>
   [esc(r.emp?.full_name)+`<br><small>${esc(r.emp?.position||'')}</small>`,esc(r.leave_code),`${fmt(r.start_date)} – ${fmt(r.end_date)}`,r.days,
   `<button class="ok" onclick="decide('${r.id}','approved')">Approve</button> <button class="bad" onclick="decide('${r.id}','rejected')">Reject</button> <button class="ghost" onclick="msgs('${r.id}')">Details</button>`]),'Nothing waiting for you.')}`},

async cal(){
  const m=V._m||(V._m=new Date(new Date().getFullYear(),new Date().getMonth(),1));
  const from=m.toISOString().slice(0,10),last=new Date(m.getFullYear(),m.getMonth()+1,0);
  const {data}=await sb.rpc('hr_calendar',{p_from:from,p_to:last.toISOString().slice(0,10)});
  const lead=(m.getDay()+6)%7;let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(lead);
  for(let d=1;d<=last.getDate();d++){const iso=`${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    h+=`<div><b>${d}</b>`+(data||[]).filter(r=>r.start_date<=iso&&r.end_date>=iso).map(r=>`<span class="ev ${r.status==='approved'?'':'p'}" title="${esc(r.full_name)} · ${ST[r.status]}">${esc(r.full_name)}</span>`).join('')+'</div>'}
  $('#main').innerHTML=`<h2>Calendar</h2><div class="row"><button class="ghost" onclick="mon(-1)">‹</button><b>${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button class="ghost" onclick="mon(1)">›</button>
  <small>Solid = approved, light = pending</small></div><div class="cal">${h}</div>`},


async hist(){
  const {data:req} = await sb.from('hr_requests').select('*,e:hr_employees(employee_no,full_name)').order('start_date',{ascending:false}).limit(500);
  const {data:days} = await sb.from('hr_leave_days').select('*,e:hr_employees(employee_no,full_name)').order('day',{ascending:false}).limit(1000).catch(()=>({data:[]}));
  const q = document.getElementById('hq') ? document.getElementById('hq').value.toLowerCase() : '';
  const rows=(req||[]).filter(r=>!q||(r.e?.full_name||'').toLowerCase().includes(q)||(r.e?.employee_no||'').toLowerCase().includes(q));
  $('#main').innerHTML = '<h2>Vacation History - Full</h2><p style="color:var(--mut)">Every vacation from Google Sheet Leaves Log, grouped into one request per continuous period. Source: Operations Team Leaves - Leaves Log 2025-01-01 to 2026-11-11. New requests go through Team Leader - Manager - HR.</p><div class="row"><input id="hq" placeholder="Search name or HR ID" value="'+q+'" oninput="V.hist()" style="max-width:320px"><span class="pill">'+rows.length+' history requests</span><span class="pill">'+((days||[]).length)+' day-rows</span></div>' + table(['Employee','HR ID','Leave','Dates','Days','Status','Source'], rows.map(r=>[esc(r.e?.full_name||''),esc(r.e?.employee_no||''),esc(r.leave_code),fmt(r.start_date)+' - '+fmt(r.end_date),r.days,pill(r.status),esc(r.reason||'Imported from Sheet')])) + '<h3 style="margin-top:22px">Day-by-day log</h3>' + table(['Date','Employee','HR ID','Leave','Day type'], (days||[]).slice(0,300).map(d=>[fmt(d.day),esc(d.e?.full_name||''),esc(d.e?.employee_no||''),esc(d.leave_code),esc(d.day_type)])));
},
async notif(){
  const {data}=await sb.from('hr_notifications').select('*').order('created_at',{ascending:false}).limit(100);
  $('#main').innerHTML=`<h2>Notifications</h2><div class="row"><button class="ghost" onclick="readAll()">Mark all as read</button></div>`+
   ((data||[]).map(n=>`<div class="card ${n.read?'':'unread'}" style="margin-bottom:8px;cursor:pointer" onclick="openN(${n.id},'${n.request_id||''}')">${esc(n.title)}<br><small style="color:var(--mut)">${new Date(n.created_at).toLocaleString()}</small></div>`).join('')||'<p>No notifications yet.</p>')},

async emp(){
  const [{data:es},{data:bs}]=await Promise.all([sb.from('hr_employees').select('*').order('full_name'),sb.from('hr_balances').select('*').eq('year',YEAR)]);
  const B=Object.fromEntries((bs||[]).map(b=>[b.employee_id,b]));
  $('#main').innerHTML=`<h2>Employees</h2><div class="wrap">${table(['ID','Name','Role','Status','Remaining',''],(es||[]).map(e=>{const b=B[e.id];
   return [esc(e.employee_no),esc(e.full_name)+`<br><small>${esc(e.email)}</small>`,esc(e.role),esc(e.status),b?b.entitlement+b.carried+b.adjustments-b.used-b.pending:'–',
   `<button class="ghost" onclick="adjust('${e.id}')">Adjust balance</button>`]}))}</div>`},

async rep(){
  $('#main').innerHTML=`<h2>Reports</h2><div class="card" style="max-width:420px"><label for="rt">Report</label><select id="rt">
  ${[['all','All requests'],['pending','Pending requests'],['rejected','Rejected requests'],['sick','Sick leave'],['emergency','Emergency leave'],['unpaid','Unpaid leave'],['balances','Remaining balances']].map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select>
  <div class="row" style="margin-top:14px"><button onclick="exportX()">Export Excel</button><button class="ghost" onclick="window.print()">Print / save PDF</button></div></div><div id="rout"></div>`},

async pol(){
  const [{data:lt},{data:st}]=await Promise.all([sb.from('hr_leave_types').select('*').order('code'),sb.from('hr_settings').select('*').order('key')]);
  $('#main').innerHTML=`<h2>Policies</h2><p style="color:var(--mut)">Every saved change creates a new policy version. Empty = no limit / not set.</p>
  <div class="wrap">${table(['Type','Allowance','Max days','Notice days','Needs document','Active','v',''],(lt||[]).map(t=>[esc(t.name),
   `<input id="a_${t.code}" type="number" value="${t.allowance??''}">`,`<input id="m_${t.code}" type="number" value="${t.max_days??''}">`,`<input id="n_${t.code}" type="number" value="${t.min_notice_days}">`,
   `<input id="d_${t.code}" type="checkbox" ${t.requires_document?'checked':''}>`,`<input id="x_${t.code}" type="checkbox" ${t.active?'checked':''}>`,t.version,`<button onclick="savePol('${t.code}')">Save</button>`]))}</div>
  <h2 style="margin-top:24px">Company rules</h2>${table(['Rule','Value (JSON)','Note',''],(st||[]).map(s=>[esc(s.key),`<input id="s_${s.key}" value='${esc(JSON.stringify(s.value))}'>`,esc(s.note||''),`<button onclick="saveSet('${s.key}')">Save</button>`]))}`}
};

function table(h,rows,empty='Nothing here yet.'){return `<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}">${empty}</td></tr>`}</table></div>`}

/* ---------- actions ---------- */
async function submitReq(){const {data,error}=await sb.rpc('hr_submit_request',{p_leave:$('#lt').value,p_start:$('#sd').value,p_end:$('#ed').value,p_reason:$('#rs').value,p_doc:$('#doc').value});
  if(error||!data.ok)return alert(error?.message||data.error);toast(`Request sent (${data.days} working days)`);go('mine')}
async function cancelReq(id){if(!confirm('Cancel this request?'))return;const {data}=await sb.rpc('hr_cancel_request',{p_req:id});data.ok?toast('Request cancelled'):alert(data.error)}
async function decide(id,dec){let c=prompt(dec==='rejected'?'Rejection reason (required):':'Comment (optional):')??null;if(c===null)return;let o=null;
  let {data}=await sb.rpc('hr_decide',{p_req:id,p_decision:dec,p_comment:c,p_override:o});
  if(!data.ok&&data.warnings){o=prompt('Warnings:\n- '+data.warnings.join('\n- ')+'\n\nHR admin override reason (leave empty to stop):');if(!o)return;
    ({data}=await sb.rpc('hr_decide',{p_req:id,p_decision:dec,p_comment:c,p_override:o}))}
  data.ok?toast(dec==='approved'?'Approved':'Rejected'):alert(data.error)}
function mon(n){V._m=new Date(V._m.getFullYear(),V._m.getMonth()+n,1);V.cal()}
async function openN(id,req){await sb.from('hr_notifications').update({read:true}).eq('id',id);badge();req?msgs(req):V.notif()}
async function readAll(){await sb.from('hr_notifications').update({read:true}).eq('read',false);badge();V.notif()}
async function adjust(id){const d=parseFloat(prompt('Days to add (negative to remove):'));if(isNaN(d))return;const r=prompt('Reason (required):');
  const {data}=await sb.rpc('hr_adjust_balance',{p_emp:id,p_year:YEAR,p_days:d,p_reason:r});data.ok?toast('Balance updated'):alert(data.error)}
async function savePol(c){const v=id=>$('#'+id+'_'+c);const num=e=>e.value===''?null:Number(e.value);
  const {error}=await sb.from('hr_leave_types').update({allowance:num(v('a')),max_days:num(v('m')),min_notice_days:Number(v('n').value||0),requires_document:v('d').checked,active:v('x').checked}).eq('code',c);
  error?alert(error.message):(toast('Policy saved (new version)'),V.pol())}
async function saveSet(k){let val;try{val=JSON.parse($('#s_'+k).value)}catch{return alert('Value must be valid JSON')}
  const {error}=await sb.from('hr_settings').update({value:val}).eq('key',k);error?alert(error.message):toast('Rule saved')}

async function msgs(id){openReq=id;
  const [{data:r},{data:ap},{data:ms},{data:w}]=await Promise.all([sb.from('hr_requests').select('*,emp:hr_employees(full_name)').eq('id',id).single(),
    sb.from('hr_approvals').select('*').eq('request_id',id).order('created_at'),sb.from('hr_messages').select('*,s:hr_employees(full_name)').eq('request_id',id).order('created_at'),
    isHR()?sb.rpc('hr_warnings',{p_req:id}):{data:[]}]);
  $('#dlg').innerHTML=`<h3>${esc(r.emp?.full_name)} · ${esc(r.leave_code)}</h3><p>${fmt(r.start_date)} – ${fmt(r.end_date)} · ${r.days} days<br>${pill(r.status)} ${steps(r)}</p>
  ${r.reason?`<p><small>Reason:</small> ${esc(r.reason)}</p>`:''}${(w||[]).map(x=>`<p style="color:var(--warn)">⚠ ${esc(x)}</p>`).join('')}
  <h4>History</h4>${(ap||[]).map(a=>`<div class="msg"><b>${esc(a.stage)}</b>: ${esc(a.decision)} <small>${new Date(a.created_at).toLocaleString()}</small>${a.comment?`<br>${esc(a.comment)}`:''}</div>`).join('')||'<small>No decisions yet.</small>'}
  <h4>Messages</h4>${(ms||[]).map(m=>`<div class="msg"><b>${esc(m.s?.full_name)}</b> <small>${new Date(m.created_at).toLocaleString()}</small><br>${esc(m.body)}</div>`).join('')||'<small>No messages.</small>'}
  <div class="row" style="margin-top:10px"><input id="mb" placeholder="Write a message…" style="flex:1"><button onclick="sendMsg('${id}')">Send</button></div>
  <div class="row"><button class="ghost" onclick="$('#dlg').close()">Close</button></div>`;
  if(!$('#dlg').open)$('#dlg').showModal()}
async function sendMsg(id){const b=$('#mb').value.trim();if(!b)return;const {error}=await sb.from('hr_messages').insert({request_id:id,sender_id:me.id,body:b});error?alert(error.message):msgs(id)}

async function exportX(){const k=$('#rt').value;let rows=[];
  if(k==='balances'){const {data}=await sb.from('hr_balances').select('*,e:hr_employees(employee_no,full_name)').eq('year',YEAR);
    rows=(data||[]).map(b=>({ID:b.e?.employee_no,Name:b.e?.full_name,Entitlement:b.entitlement,Carried:b.carried,Adjustments:b.adjustments,Used:b.used,Pending:b.pending,Remaining:b.entitlement+b.carried+b.adjustments-b.used-b.pending}))}
  else{let q=sb.from('hr_requests').select('*,e:hr_employees(employee_no,full_name,department_id,city_id)').order('start_date',{ascending:false});
    if(k==='pending')q=q.in('status',['pending_tl','pending_manager','pending_hr']);else if(k==='rejected')q=q.eq('status','rejected');else if(k!=='all')q=q.eq('leave_code',k);
    const {data}=await q;rows=(data||[]).map(r=>({ID:r.e?.employee_no,Name:r.e?.full_name,Type:r.leave_code,Start:r.start_date,End:r.end_date,Days:r.days,Status:ST[r.status]}))}
  $('#rout').innerHTML=table(Object.keys(rows[0]||{Result:1}),rows.map(r=>Object.values(r).map(esc)),'No data for this report.');
  if(rows.length){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Report');XLSX.writeFile(wb,`wade-${k}-${YEAR}.xlsx`)}}

boot();
</script>
